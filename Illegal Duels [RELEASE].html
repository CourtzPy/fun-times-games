<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Illegal Duels</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #070304;
      overflow: hidden;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #front {
      z-index: 2;
      pointer-events: none;
    }
    .menu {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 9vh;
      pointer-events: none;
    }
    .title {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2em;
      margin: 0;
      font-size: clamp(68px, 13vw, 150px);
      user-select: none;
    }
    .modes {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: none;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px;
      pointer-events: none;
    }
    .modes.show {
      display: flex;
      background-color: #8ec8ef;
      background-image: url("mountain.png");
      background-repeat: no-repeat;
      background-size: 165% 130%;
      animation: mountain-drift 32s ease-in-out infinite alternate;
    }
    @keyframes mountain-drift {
      from { background-position: 0% 70%; }
      to { background-position: 100% 30%; }
    }
    .menu.is-hidden {
      display: none;
    }
    #search {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: rgba(7, 3, 4, 0.72);
    }
    #search.show {
      display: flex;
    }
    #search p {
      margin: 0;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      font-size: clamp(28px, 4vw, 52px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff6df;
      text-shadow: 0 3px 0 #2a0c04;
    }
    #cancel-search,
    #leave-room {
      pointer-events: auto;
      cursor: pointer;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f3e6d4;
      background: linear-gradient(180deg, #c14a42 0%, #8a2c28 48%, #3a1210 100%);
      border: 3px solid #1a0e0c;
      text-shadow: 0 2px 0 rgba(28, 8, 6, 0.55);
    }
    #cancel-search {
      font-size: clamp(22px, 3vw, 36px);
      padding: 0.22em 1.4em 0.16em;
    }
    #leave-room {
      position: fixed;
      z-index: 4;
      top: 18px;
      left: 18px;
      font-size: 22px;
      padding: 0.2em 0.8em 0.14em;
    }
    .play {
      pointer-events: auto;
      cursor: pointer;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      font-size: clamp(28px, 4vw, 46px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #f3e6d4;
      background: linear-gradient(180deg, #c14a42 0%, #8a2c28 48%, #3a1210 100%);
      border: 3px solid #1a0e0c;
      padding: 0.28em 3.2em 0.22em;
      text-shadow: 0 2px 0 rgba(28, 8, 6, 0.55);
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.45));
      transition: transform 0.16s ease, filter 0.16s ease, background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }
    .play {
      margin-top: 6vh;
      clip-path: polygon(
        0 0,
        78% 0,
        81% 9px,
        76% 15px,
        83% 13px,
        86% 24px,
        92% 18px,
        95% 30px,
        100% 36px,
        100% 100%,
        0 100%
      );
    }
    .mode {
      position: relative;
      width: min(42vw, 360px);
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(0, 0, 0, 0.58);
      border: 2px solid rgba(92, 52, 32, 0.95);
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.4);
      color: #fff6df;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      font-size: clamp(22px, 3vw, 34px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      z-index: 1;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .mode-pics {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .mode-label {
      position: relative;
      z-index: 1;
      text-shadow:
        0 2px 0 #1a0a06,
        0 0 8px rgba(0, 0, 0, 0.95),
        0 0 16px rgba(0, 0, 0, 0.8);
    }
    .mode img {
      height: 168px;
      width: auto;
      max-width: 52%;
      object-fit: contain;
      pointer-events: none;
    }
    .mode-online .mode-pics img {
      position: absolute;
      left: 50%;
      top: 50%;
      height: 168px;
      width: auto;
      max-width: none;
    }
    .mode-online .mode-pics img:first-child {
      transform: translate(-50%, -52%) rotate(-48deg);
    }
    .mode-online .mode-pics img:nth-child(2) {
      transform: translate(-50%, -52%) rotate(42deg);
    }
    .peak {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .mode:hover {
      transform: scale(1.04);
      border-color: #d08a45;
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.45), 0 0 18px rgba(180, 90, 30, 0.35);
    }
    .play:hover {
      transform: scale(1.08);
      color: #fff1e6;
      background: linear-gradient(180deg, #d8665c 0%, #a43c36 48%, #4a1a16 100%);
      border-color: #2a1614;
      filter:
        drop-shadow(0 8px 12px rgba(0, 0, 0, 0.4))
        drop-shadow(0 0 16px rgba(210, 60, 40, 0.55));
    }
    .word {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.14em;
    }
    .letter {
      display: inline-block;
      font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      font-size: 1em;
      line-height: 1;
      color: #fff6df;
      -webkit-text-stroke: 3px #2a0c04;
      paint-order: stroke fill;
      text-shadow:
        0 0 18px rgba(255, 120, 20, 0.85),
        0 7px 0 #4a1608,
        4px 12px 0 rgba(0, 0, 0, 0.45);
      transform: translate(var(--x), var(--y)) rotate(var(--r));
    }
  </style>
</head>
<body>
  <canvas id="back"></canvas>
  <div class="menu">
  <h1 class="title" aria-label="Illegal Duels">
    <span class="word">
      <span class="letter" style="--x:0;--y:-0.04em;--r:-3deg">I</span>
      <span class="letter" style="--x:0;--y:0.05em;--r:4deg">l</span>
      <span class="letter" style="--x:0;--y:-0.02em;--r:-2deg">l</span>
      <span class="letter" style="--x:0;--y:0.04em;--r:3deg">e</span>
      <span class="letter" style="--x:0;--y:-0.05em;--r:-4deg">g</span>
      <span class="letter" style="--x:0;--y:0.03em;--r:2deg">a</span>
      <span class="letter" style="--x:0;--y:-0.03em;--r:3deg">l</span>
    </span>
    <span class="word">
      <span class="letter" style="--x:0;--y:0.04em;--r:-3deg">D</span>
      <span class="letter" style="--x:0;--y:-0.05em;--r:4deg">u</span>
      <span class="letter" style="--x:0;--y:0.02em;--r:-2deg">e</span>
      <span class="letter" style="--x:0;--y:-0.04em;--r:3deg">l</span>
      <span class="letter" style="--x:0;--y:0.05em;--r:-3deg">s</span>
    </span>
  </h1>
  <button class="play" type="button">Play</button>
  </div>
  <div class="modes">
    <canvas class="peak" id="peak"></canvas>
    <button class="mode mode-online" type="button">
      <span class="mode-pics">
        <img src="rpg.png?v=clear" alt="RPG">
        <img src="glock.png?v=clear" alt="Glock">
      </span>
      <span class="mode-label">Online</span>
    </button>
    <button class="mode mode-bots" type="button">
      <span class="mode-pics">
        <img src="robot.png?v=clear" alt="Robot">
      </span>
      <span class="mode-label">Bots</span>
    </button>
  </div>
  <div id="search">
    <p id="search-text">Searching for an opponent…</p>
    <button id="cancel-search" type="button">Cancel</button>
  </div>
  <button id="leave-room" type="button" hidden>Leave</button>
  <canvas id="front"></canvas>
  <script>
    const back = document.getElementById("back");
    const front = document.getElementById("front");
    const backCtx = back.getContext("2d");
    const frontCtx = front.getContext("2d");
    const peak = document.getElementById("peak");
    const peakCtx = peak.getContext("2d");
    const title = document.querySelector(".title");

    let width = 0;
    let height = 0;
    let shake = 0;
    let modesShownAt = 0;
    const bursts = [];
    const embers = [];
    const peakBursts = [];

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      const ratio = window.devicePixelRatio || 1;
      for (const canvas of [back, front, peak]) {
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        canvas.getContext("2d").setTransform(ratio, 0, 0, ratio, 0, 0);
      }
    }

    function spawnEmber() {
      embers.push({
        x: Math.random() * width,
        y: height * (0.35 + Math.random() * 0.7),
        vy: -20 - Math.random() * 50,
        vx: -12 + Math.random() * 24,
        life: 1.4 + Math.random() * 2.2,
        age: 0,
        size: 1 + Math.random() * 2.4
      });
    }

    function explode(x, y, power) {
      const sparks = [];
      const smoke = [];
      const sparkCount = 28 + Math.floor(power * 46);
      for (let i = 0; i < sparkCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = (50 + Math.random() * 280) * (0.45 + power);
        sparks.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 30 * power,
          life: 0.4 + Math.random() * 0.75,
          age: 0,
          size: 1.6 + Math.random() * 3.2 * power,
          hot: Math.random(),
          streak: 0.02 + Math.random() * 0.045
        });
      }
      const smokeCount = 8 + Math.floor(power * 10);
      for (let i = 0; i < smokeCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        smoke.push({
          x: x + Math.cos(angle) * 8,
          y: y + Math.sin(angle) * 8,
          vx: Math.cos(angle) * (12 + Math.random() * 30),
          vy: -10 - Math.random() * 40,
          life: 0.9 + Math.random() * 1.1,
          age: 0,
          size: 6 + Math.random() * 8 * power
        });
      }
      bursts.push({
        x,
        y,
        power,
        age: 0,
        life: 0.55 + power * 0.25,
        ring: 6,
        sparks,
        smoke
      });
      if (power > 0.72) shake = Math.max(shake, 7 + power * 8);
    }

    function seed() {
      for (let i = 0; i < 12; i++) {
        explode(Math.random() * width, Math.random() * height * 0.92, 0.5 + Math.random() * 0.8);
      }
      for (let i = 0; i < 40; i++) spawnEmber();
    }

    let last = performance.now();
    let spawnIn = 0.15;

    function frame(now) {
      if (document.body.dataset.phase === "room") {
        requestAnimationFrame(frame);
        return;
      }
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      spawnIn -= dt;
      if (spawnIn <= 0) {
        const big = Math.random() < 0.28;
        explode(
          width * (0.08 + Math.random() * 0.84),
          height * (0.12 + Math.random() * 0.76),
          big ? 0.85 + Math.random() * 0.45 : 0.35 + Math.random() * 0.4
        );
        spawnIn = 0.05 + Math.random() * 0.14;
      }
      if (Math.random() < 0.6) spawnEmber();

      backCtx.globalCompositeOperation = "source-over";
      const sky = backCtx.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, "#14060a");
      sky.addColorStop(0.55, "#2a0c08");
      sky.addColorStop(1, "#4a1608");
      backCtx.fillStyle = sky;
      backCtx.fillRect(0, 0, width, height);

      backCtx.globalCompositeOperation = "source-over";
      for (const burst of bursts) {
        for (const puff of burst.smoke) {
          const t = puff.age / puff.life;
          backCtx.beginPath();
          backCtx.fillStyle = "rgba(40, 22, 18, " + (0.28 * (1 - t)) + ")";
          backCtx.arc(puff.x, puff.y, puff.size * (1 + t * 2.2), 0, Math.PI * 2);
          backCtx.fill();
        }
      }

      backCtx.globalCompositeOperation = "lighter";
      for (const burst of bursts) {
        const t = burst.age / burst.life;
        const flash = backCtx.createRadialGradient(burst.x, burst.y, 0, burst.x, burst.y, 30 + burst.power * 90);
        flash.addColorStop(0, "rgba(255,255,240," + (0.9 * (1 - t)) + ")");
        flash.addColorStop(0.35, "rgba(255,150,30," + (0.55 * (1 - t)) + ")");
        flash.addColorStop(1, "rgba(255,40,0,0)");
        backCtx.fillStyle = flash;
        backCtx.beginPath();
        backCtx.arc(burst.x, burst.y, 30 + burst.power * 90, 0, Math.PI * 2);
        backCtx.fill();

        backCtx.strokeStyle = "rgba(255, 210, 140, " + (0.7 * (1 - t)) + ")";
        backCtx.lineWidth = 3 * (1 - t) + 1;
        backCtx.beginPath();
        backCtx.arc(burst.x, burst.y, burst.ring, 0, Math.PI * 2);
        backCtx.stroke();

        for (const spark of burst.sparks) {
          const st = spark.age / spark.life;
          const hot = spark.hot > 0.55;
          const color = hot
            ? "rgba(255, 244, 210, " + (1 - st) + ")"
            : "rgba(255, " + Math.floor(80 + spark.hot * 130) + ", 16, " + (1 - st) + ")";
          backCtx.strokeStyle = color;
          backCtx.lineWidth = spark.size * 0.7;
          backCtx.lineCap = "round";
          backCtx.beginPath();
          backCtx.moveTo(spark.x, spark.y);
          backCtx.lineTo(spark.x - spark.vx * spark.streak, spark.y - spark.vy * spark.streak);
          backCtx.stroke();
          backCtx.fillStyle = color;
          backCtx.fillRect(spark.x, spark.y, spark.size, spark.size);
        }
      }

      frontCtx.clearRect(0, 0, width, height);
      frontCtx.globalCompositeOperation = "lighter";
      for (const ember of embers) {
        const t = ember.age / ember.life;
        frontCtx.fillStyle = "rgba(255, " + Math.floor(140 + (1 - t) * 80) + ", 40, " + (1 - t) + ")";
        frontCtx.beginPath();
        frontCtx.arc(ember.x, ember.y, ember.size, 0, Math.PI * 2);
        frontCtx.fill();
      }

      for (let i = bursts.length - 1; i >= 0; i--) {
        const burst = bursts[i];
        burst.age += dt;
        burst.ring += (220 + burst.power * 260) * dt;
        for (const spark of burst.sparks) {
          spark.age += dt;
          spark.x += spark.vx * dt;
          spark.y += spark.vy * dt;
          spark.vy += 140 * dt;
          spark.vx *= 0.985;
        }
        for (const puff of burst.smoke) {
          puff.age += dt;
          puff.x += puff.vx * dt;
          puff.y += puff.vy * dt;
        }
        burst.sparks = burst.sparks.filter((spark) => spark.age < spark.life);
        burst.smoke = burst.smoke.filter((puff) => puff.age < puff.life);
        if (burst.age >= burst.life && burst.sparks.length === 0) bursts.splice(i, 1);
      }

      for (let i = embers.length - 1; i >= 0; i--) {
        const ember = embers[i];
        ember.age += dt;
        ember.x += ember.vx * dt;
        ember.y += ember.vy * dt;
        if (ember.age >= ember.life || ember.y < -10) embers.splice(i, 1);
      }

      shake *= Math.pow(0.04, dt);
      if (shake < 0.2) shake = 0;
      const jx = (Math.random() - 0.5) * shake;
      const jy = (Math.random() - 0.5) * shake;
      title.style.transform = "translate(" + jx.toFixed(2) + "px," + jy.toFixed(2) + "px)";

      drawPeak(dt);
      requestAnimationFrame(frame);
    }

    function summitPoint() {
      const elapsed = performance.now() - modesShownAt;
      const cycle = 32000;
      const trip = (elapsed % (cycle * 2)) / cycle;
      const phase = trip <= 1 ? trip : 2 - trip;
      const eased = phase < 0.5
        ? 2 * phase * phase
        : 1 - Math.pow(-2 * phase + 2, 2) / 2;
      const imageW = width * 1.65;
      const imageH = height * 1.3;
      const yAlign = 0.7 + (0.3 - 0.7) * eased;
      const offsetX = (width - imageW) * eased;
      const offsetY = (height - imageH) * yAlign;
      return {
        x: offsetX + imageW * 0.55,
        y: offsetY + imageH * 0.32
      };
    }

    function explodePeak(x, y) {
      const sparks = [];
      const smoke = [];
      for (let i = 0; i < 90; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 80 + Math.random() * 340;
        sparks.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 40,
          life: 1.6 + Math.random() * 1.1,
          age: 0,
          size: 2 + Math.random() * 4,
          hot: Math.random(),
          streak: 0.025 + Math.random() * 0.04
        });
      }
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        smoke.push({
          x, y,
          vx: Math.cos(angle) * (16 + Math.random() * 28),
          vy: -16 - Math.random() * 36,
          life: 1.1 + Math.random() * 0.8,
          age: 0,
          size: 10 + Math.random() * 14
        });
      }
      peakBursts.push({ x, y, age: 0, life: 2.4, ring: 8, sparks, smoke });
    }

    function drawPeak(dt) {
      peakCtx.clearRect(0, 0, width, height);
      if (peakBursts.length === 0) return;
      peakCtx.globalCompositeOperation = "source-over";
      for (const burst of peakBursts) {
        for (const puff of burst.smoke) {
          const t = puff.age / puff.life;
          peakCtx.beginPath();
          peakCtx.fillStyle = "rgba(70, 50, 40, " + (0.28 * (1 - t)) + ")";
          peakCtx.arc(puff.x, puff.y, puff.size * (1 + t * 2), 0, Math.PI * 2);
          peakCtx.fill();
        }
      }
      peakCtx.globalCompositeOperation = "lighter";
      for (const burst of peakBursts) {
        const t = burst.age / burst.life;
        const flash = peakCtx.createRadialGradient(burst.x, burst.y, 0, burst.x, burst.y, 120);
        flash.addColorStop(0, "rgba(255,255,230," + (0.95 * (1 - t)) + ")");
        flash.addColorStop(0.35, "rgba(255,140,30," + (0.6 * (1 - t)) + ")");
        flash.addColorStop(1, "rgba(255,40,0,0)");
        peakCtx.fillStyle = flash;
        peakCtx.beginPath();
        peakCtx.arc(burst.x, burst.y, 120, 0, Math.PI * 2);
        peakCtx.fill();
        peakCtx.strokeStyle = "rgba(255, 220, 160, " + (0.75 * (1 - t)) + ")";
        peakCtx.lineWidth = 4 * (1 - t) + 1;
        peakCtx.beginPath();
        peakCtx.arc(burst.x, burst.y, burst.ring, 0, Math.PI * 2);
        peakCtx.stroke();
        for (const spark of burst.sparks) {
          const st = spark.age / spark.life;
          const color = spark.hot > 0.55
            ? "rgba(255, 244, 210, " + (1 - st) + ")"
            : "rgba(255, " + Math.floor(80 + spark.hot * 120) + ", 20, " + (1 - st) + ")";
          peakCtx.strokeStyle = color;
          peakCtx.lineWidth = spark.size * 0.7;
          peakCtx.lineCap = "round";
          peakCtx.beginPath();
          peakCtx.moveTo(spark.x, spark.y);
          peakCtx.lineTo(spark.x - spark.vx * spark.streak, spark.y - spark.vy * spark.streak);
          peakCtx.stroke();
        }
      }
      for (let i = peakBursts.length - 1; i >= 0; i--) {
        const burst = peakBursts[i];
        burst.age += dt;
        burst.ring += 420 * dt;
        for (const spark of burst.sparks) {
          spark.age += dt;
          spark.x += spark.vx * dt;
          spark.y += spark.vy * dt;
          spark.vy += 160 * dt;
        }
        for (const puff of burst.smoke) {
          puff.age += dt;
          puff.x += puff.vx * dt;
          puff.y += puff.vy * dt;
        }
        burst.sparks = burst.sparks.filter((spark) => spark.age < spark.life);
        burst.smoke = burst.smoke.filter((puff) => puff.age < puff.life);
        if (burst.age >= burst.life && burst.sparks.length === 0) peakBursts.splice(i, 1);
      }
    }

    document.querySelector(".play").addEventListener("click", () => {
      document.querySelector(".menu").classList.add("is-hidden");
      document.querySelector(".modes").classList.add("show");
      modesShownAt = performance.now();
      window.setTimeout(() => {
        const point = summitPoint();
        explodePeak(point.x, point.y);
      }, 5000);
    });

    resize();
    seed();
    window.addEventListener("resize", resize);
    requestAnimationFrame(frame);
  </script>
  <script type="module" src="online.js"></script>
</body>
</html>
