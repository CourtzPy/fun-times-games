<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Monster Keep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0b0a10;
    --panel:#1b1712;
    --panel2:#241d16;
    --stone:#3a3024;
    --stone-light:#4c3f30;
    --blood:#9c2b3a;
    --blood-bright:#c8404f;
    --toxic:#7fae4a;
    --toxic-dim:#5c7f38;
    --torch:#d9822e;
    --bone:#e9dfc4;
    --bone-dim:#a89f8a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--void);overflow:hidden;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--bone);
    display:flex;
    flex-direction:column;
    height:100%;
    background:radial-gradient(ellipse at 50% 0%, #241a2e 0%, var(--void) 60%);
    user-select:none;
  }
  .title-row{display:flex; align-items:baseline; justify-content:space-between; padding:10px 12px 4px; flex-shrink:0;}
  .game-title{font-family:'Cinzel',serif; font-weight:800; font-size:19px; letter-spacing:0.5px; color:var(--torch); text-shadow:0 0 12px rgba(217,130,46,0.35); margin:0;}
  .wave-lbl{font-size:11px; color:var(--bone-dim);}
  .hud{display:flex; gap:8px; padding:0 12px 8px; flex-shrink:0;}
  .stat{flex:1; background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--stone-light); border-radius:8px; padding:6px 8px; display:flex; align-items:center; gap:6px;}
  .stat svg{width:16px; height:16px; flex-shrink:0;}
  .stat .val{font-weight:700; font-size:13.5px; font-variant-numeric:tabular-nums;}
  .stat .lbl{font-size:9px; color:var(--bone-dim); text-transform:uppercase; letter-spacing:0.4px; margin-left:2px;}
  .stat.gold .val{color:var(--torch);}
  .stat.lives .val{color:var(--blood-bright);}
  .stat.phase .val{color:var(--toxic);}
  .stat.phase.night .val{color:#8fa9ff;}

  .board-wrap{flex:1; display:flex; align-items:center; justify-content:center; min-height:0; position:relative; padding:4px 8px;}
  #boardInner{
    position:relative;
    height:100%; width:auto;
    max-height:640px; max-width:434px;
    aspect-ratio:280/413;
  }
  #board{
    position:absolute; inset:0; width:100%; height:100%;
    display:block;
    background:#1c2f18; border-radius:10px; border:2px solid var(--stone-light);
    box-shadow:0 8px 24px rgba(0,0,0,0.5), inset 0 0 40px rgba(0,0,0,0.5);
    touch-action:none;
  }
  .toast{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:rgba(20,16,25,0.92); border:1px solid var(--stone-light);
    padding:6px 14px; border-radius:20px; font-size:12px; color:var(--bone);
    opacity:0; pointer-events:none; transition:opacity 0.3s; white-space:nowrap;
    max-width:90%; text-overflow:ellipsis; overflow:hidden; z-index:5;
  }
  .toast.show{opacity:1;}

  #joystick{
    position:absolute; right:14px; bottom:14px; width:80px; height:80px;
    border-radius:50%; background:rgba(255,255,255,0.14); border:2px solid rgba(255,255,255,0.4);
    touch-action:none; z-index:4;
  }
  #joystickKnob{
    position:absolute; width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,0.55); left:23px; top:23px;
    box-shadow:0 2px 6px rgba(0,0,0,0.35);
  }

  .controls-row{display:flex; align-items:center; gap:8px; padding:8px 12px; flex-shrink:0;}
  .btn{font-family:'Inter',sans-serif; font-weight:700; font-size:13px; border:none; border-radius:8px; padding:10px 14px; cursor:pointer; color:var(--bone); background:var(--stone); border:1px solid var(--stone-light);}
  .btn:active{transform:scale(0.97);}
  .btn.primary{background:linear-gradient(180deg,var(--toxic),var(--toxic-dim)); color:#12190a; flex:1; padding:12px; font-size:14px; box-shadow:0 3px 0 #3f5a26;}
  .btn.retreat{flex:1; background:linear-gradient(180deg,var(--blood),#6f1c27); box-shadow:0 3px 0 #4d1319;}

  .sheet-backdrop{position:fixed; inset:0; background:rgba(6,4,8,0.6); display:none; align-items:flex-end; justify-content:center; z-index:25;}
  .sheet-backdrop.show{display:flex;}
  .sheet{width:100%; max-width:420px; background:linear-gradient(180deg,var(--panel2),var(--panel)); border-top:2px solid var(--stone-light); border-radius:16px 16px 0 0; padding:16px; animation:slideup 0.2s ease-out;}
  @keyframes slideup{from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet h3{font-family:'Cinzel',serif; color:var(--torch); margin:0 0 10px; font-size:16px; text-align:center;}
  .upg-row{display:flex; align-items:center; gap:10px; background:rgba(0,0,0,0.25); border-radius:10px; padding:8px 10px; margin-bottom:8px;}
  .upg-row .upg-icon{font-size:20px; width:26px; text-align:center; flex-shrink:0;}
  .upg-row .upg-info{flex:1;}
  .upg-row .upg-name{font-weight:700; font-size:12.5px;}
  .upg-row .upg-val{font-size:10.5px; color:var(--bone-dim);}
  .upg-row .upg-btn{flex-shrink:0; font-size:11.5px; padding:8px 10px;}
  .upg-row .upg-btn:disabled{opacity:0.45;}
  .btn.close-sheet{width:100%; margin-top:4px; background:var(--stone);}

  .overlay{position:fixed; inset:0; background:rgba(6,4,8,0.85); display:none; align-items:center; justify-content:center; z-index:30; padding:20px;}
  .overlay.show{display:flex;}
  .overlay-card{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:2px solid var(--blood); border-radius:16px; padding:26px 22px; text-align:center; max-width:340px; width:100%;}
  .overlay-card h2{font-family:'Cinzel',serif; color:var(--blood-bright); margin:0 0 8px; font-size:22px;}
  .overlay-card p{font-size:13px; color:var(--bone-dim); margin:0 0 18px; line-height:1.5;}
  .overlay-card .stat-line{font-size:14px; margin-bottom:4px;}
  .overlay-card .stat-line b{color:var(--torch);}
  .select-card{border-color:var(--stone-light);}
  .select-card h2{color:var(--torch);}
</style>
</head>
<body>

  <div class="title-row">
    <p class="game-title">MONSTER KEEP</p>
    <div class="wave-lbl" id="waveEl">Wave: 0</div>
  </div>

  <div class="hud">
    <div class="stat gold">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="#d9822e" stroke="#8a5518" stroke-width="1"/><circle cx="8" cy="8" r="4" fill="none" stroke="#8a5518" stroke-width="0.8"/><path d="M6 6.2 L8 5.2 L10 6.2" fill="none" stroke="#f2c98a" stroke-width="0.9" stroke-linecap="round"/></svg>
      <span class="val" id="goldVal">0</span>
    </div>
    <div class="stat lives">
      <svg viewBox="0 0 16 16"><path d="M8 13.5 C4 10.8 1.5 8.4 1.5 5.8 C1.5 3.7 3.1 2.4 4.9 2.4 C6.1 2.4 7.2 3 8 4.1 C8.8 3 9.9 2.4 11.1 2.4 C12.9 2.4 14.5 3.7 14.5 5.8 C14.5 8.4 12 10.8 8 13.5 Z" fill="#c8404f" stroke="#7a1f28" stroke-width="0.8"/></svg>
      <span class="val" id="heroHpVal">0/0</span>
    </div>
    <div class="stat phase" id="phaseStat">
      <svg id="phaseIcon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="#ffd35a" stroke="#a87a1a" stroke-width="0.8"/></svg>
      <span class="val" id="phaseVal">Day 60s</span>
    </div>
  </div>

  <div class="board-wrap">
    <div id="boardInner">
      <canvas id="board"></canvas>
      <div id="joystick"><div id="joystickKnob"></div></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <div class="controls-row">
    <button class="btn retreat" id="retreatBtn">Retreat</button>
  </div>

  <div class="sheet-backdrop" id="upgradeSheetBackdrop">
    <div class="sheet">
      <h3 id="upgradeTitle">Upgrade Weapon</h3>
      <div id="upgradeRows"></div>
      <button class="btn close-sheet" id="upgradeCloseBtn">Close</button>
    </div>
  </div>

  <div class="overlay" id="defeatOverlay">
    <div class="overlay-card">
      <h2>Driven Back</h2>
      <p>The humans overran your camp.</p>
      <div class="stat-line">Nights survived: <b id="defeatNights">0</b></div>
      <div class="stat-line">Humans defeated: <b id="defeatKills">0</b></div>
      <button class="btn primary" id="defeatRetryBtn" style="margin-top:14px;">Try Again</button>
    </div>
  </div>

  <div class="overlay show" id="selectOverlay">
    <div class="overlay-card select-card">
      <h2>Monster Keep</h2>
      <div class="icon-slot" id="startIconSlot" style="margin:4px 0 10px;"></div>
      <p>Move with the stick. By day, recruit passing monsters into your houses for gold. By night, humans raid — survive, and it only gets harder.</p>
      <button class="btn primary" id="startBattleBtn">Enter the Field</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  // ===================== COLOR UTILS =====================
  const INK="rgba(24,17,11,0.7)";
  function hexToRgb(hex){
    const v=parseInt(hex.slice(1),16);
    return {r:(v>>16)&255, g:(v>>8)&255, b:v&255};
  }
  function lighten(hex,amt){
    const c=hexToRgb(hex);
    return "rgb("+Math.round(c.r+(255-c.r)*amt)+","+Math.round(c.g+(255-c.g)*amt)+","+Math.round(c.b+(255-c.b)*amt)+")";
  }
  function darken(hex,amt){
    const c=hexToRgb(hex);
    return "rgb("+Math.round(c.r*(1-amt))+","+Math.round(c.g*(1-amt))+","+Math.round(c.b*(1-amt))+")";
  }
  function hexToRgba(hex,a){
    const c=hexToRgb(hex);
    return "rgba("+c.r+","+c.g+","+c.b+","+a+")";
  }
  function radialShade(ctx,cx,cy,r,baseColor){
    const g=ctx.createRadialGradient(cx-r*0.35,cy-r*0.42,r*0.12,cx,cy,r*1.2);
    g.addColorStop(0, lighten(baseColor,0.4));
    g.addColorStop(0.6, baseColor);
    g.addColorStop(1, darken(baseColor,0.12));
    return g;
  }
  function roundRectPath(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  // Shrunk world: same sprite sizes now fill much more of the screen.
  const LOGICAL_W=280, LOGICAL_H=413;

  // ===================== CHARACTER ART (unchanged monster/human designs, plus two new recruits) =====================
  const CHAR_STYLES={
    goblin:{body:"#7fae4a",dark:"#4f7a30",cloth:"#5a3d22",head:"#8bbf52",sclera:"#f2e35a",pupil:"#2a2a0a",
      ears:"goblin",weapon:"dagger",weaponColor:"#cfd3d6",armColor:"#7fae4a",bulk:0.9,expr:"fierce"},
    orc:{body:"#8a7a4a",dark:"#5c4f30",cloth:"#4a3625",head:"#8a7a4a",sclera:"#d94040",pupil:"#3a0a0a",
      ears:"tusks",weapon:"axe",armColor:"#8a7a4a",bulk:1.15,expr:"fierce"},
    troll:{body:"#6b8262",dark:"#455c40",cloth:null,head:"#6b8262",sclera:"#c9d94a",pupil:"#2a2a2a",
      ears:"none",weapon:"club",armColor:"#6b8262",bulk:1.3,expr:"fierce"},
    dragon:{body:"#c0472b",dark:"#7a2416",cloth:null,head:"#c0472b",sclera:"#f2d23e",pupil:"#1a1000",
      ears:"horns",horn:"#e8dfc4",weapon:"none",armColor:"#c0472b",wings:true,wing:"rgba(90,31,20,0.9)",tail:true,bulk:1.1,expr:"fierce"},
    villager:{body:"#c9a06a",dark:"#8a6b45",cloth:"#8a6b45",head:"#e0b98a",sclera:"#f5ede0",pupil:"#3a2a1a",
      ears:"none",weapon:"none",armColor:"#c9a06a",bulk:0.8,expr:"scared"},
    soldier:{body:"#5a6b8a",dark:"#3a4560",cloth:"#3a4560",head:"#e0b98a",sclera:"#f5ede0",pupil:"#2a2015",
      ears:"helmet",armor:"#5a6b8a",weapon:"sword",armColor:"#5a6b8a",bulk:0.95,expr:"plain"},
    archer:{body:"#3f6b3f",dark:"#294a29",cloth:"#294a29",head:"#e0b98a",sclera:"#f5ede0",pupil:"#2a2015",
      ears:"hood",cloak:"#3f6b3f",weapon:"bow",armColor:"#3f6b3f",bulk:0.85,expr:"plain"},
    knight:{body:"#8a8f99",dark:"#5a5f68",cloth:"#5a5f68",head:"#e0b98a",sclera:"#f5ede0",pupil:"#2a2015",
      ears:"helmet",armor:"#8a8f99",weapon:"sword",shield:true,shieldColor:"#3a4f8a",cape:"#3a4f8a",armColor:"#8a8f99",bulk:1.05,expr:"determined"},
    boss:{body:"#c9973e",dark:"#8a641f",cloth:"#8a641f",head:"#e0b98a",sclera:"#f5ede0",pupil:"#2a2015",
      ears:"crown",armor:"#c9973e",weapon:"sword",weaponColor:"#f2e6b0",cape:"#9c2b3a",armColor:"#c9973e",bulk:1.25,expr:"fierce"},
    gremlin:{body:"#c7d94a",dark:"#8a9a2e",cloth:null,head:"#cfe05a",sclera:"#fff8d0",pupil:"#2a2a0a",
      ears:"goblin",weapon:"none",armColor:"#c7d94a",bulk:0.7,expr:"scared"},
    ogre:{body:"#8a7aa0",dark:"#5c4f70",cloth:"#4a3d5a",head:"#8a7aa0",sclera:"#e8dfc4",pupil:"#2a2015",
      ears:"tusks",weapon:"none",armColor:"#8a7aa0",bulk:1.4,expr:"plain"},
    merchant:{body:"#7a5c3a",dark:"#4f3a22",cloth:"#5a4028",head:"#e0b98a",sclera:"#f5ede0",pupil:"#2a2015",
      ears:"hood",cloak:"#6b4a2e",weapon:"none",armColor:"#7a5c3a",bulk:0.95,expr:"plain"},
  };
  const BASE_SCALE={goblin:16,orc:17,troll:18,dragon:19,villager:13,soldier:14,archer:13,knight:15,boss:24,gremlin:12,ogre:21,merchant:14};
  const HERO_DISPLAY_SCALE={goblin:19,orc:20,troll:22,dragon:23};

  function ptOut(ctx,fillStyle,lw){
    ctx.fillStyle=fillStyle; ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=lw; ctx.stroke();
  }

  function drawWeapon(ctx,s,type,C){
    const handY=0.32*s, tipY=-0.55*s;
    ctx.lineCap="round";
    if(type==="dagger"){
      ctx.strokeStyle=C.weaponColor||"#cfd3d6"; ctx.lineWidth=0.06*s;
      ctx.beginPath(); ctx.moveTo(0,handY); ctx.lineTo(0,tipY); ctx.stroke();
      ctx.fillStyle="#8a5a2a"; ctx.fillRect(-0.05*s,handY-0.1*s,0.1*s,0.12*s);
    } else if(type==="axe"){
      ctx.strokeStyle="#6b4a2a"; ctx.lineWidth=0.08*s;
      ctx.beginPath(); ctx.moveTo(0,handY); ctx.lineTo(0,tipY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,tipY); ctx.lineTo(0.3*s,tipY+0.12*s); ctx.lineTo(0.04*s,tipY+0.26*s); ctx.closePath();
      ptOut(ctx,"#9aa0a6",0.02*s);
      ctx.beginPath(); ctx.moveTo(0,tipY); ctx.lineTo(-0.26*s,tipY+0.14*s); ctx.lineTo(-0.02*s,tipY+0.28*s); ctx.closePath();
      ptOut(ctx,"#9aa0a6",0.02*s);
    } else if(type==="club"){
      ctx.strokeStyle="#5c4326"; ctx.lineWidth=0.1*s;
      ctx.beginPath(); ctx.moveTo(0,handY); ctx.lineTo(0,tipY+0.1*s); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0,tipY,0.16*s,0.2*s,0,0,Math.PI*2);
      ptOut(ctx,"#6b5636",0.025*s);
      ctx.fillStyle="rgba(0,0,0,0.2)";
      ctx.beginPath(); ctx.arc(-0.05*s,tipY-0.05*s,0.03*s,0,Math.PI*2); ctx.fill();
    } else if(type==="sword"){
      ctx.strokeStyle="#d9dde0"; ctx.lineWidth=0.06*s;
      ctx.beginPath(); ctx.moveTo(0,handY); ctx.lineTo(0,tipY); ctx.stroke();
      ctx.strokeStyle=INK; ctx.lineWidth=0.015*s;
      ctx.beginPath(); ctx.moveTo(0,handY); ctx.lineTo(0,tipY); ctx.stroke();
      ctx.strokeStyle="#8a6a2a"; ctx.lineWidth=0.09*s; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(-0.11*s,handY-0.16*s); ctx.lineTo(0.11*s,handY-0.16*s); ctx.stroke();
    } else if(type==="bow"){
      const cx=0, cy=handY-0.15*s, r=0.3*s, a1=-Math.PI*0.4, a2=Math.PI*0.4;
      ctx.strokeStyle="#7a5a34"; ctx.lineWidth=0.05*s;
      ctx.beginPath(); ctx.arc(cx,cy,r,a1,a2); ctx.stroke();
      ctx.strokeStyle="rgba(255,255,255,0.55)"; ctx.lineWidth=0.018*s;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a1)*r, cy+Math.sin(a1)*r);
      ctx.lineTo(cx+Math.cos(a2)*r, cy+Math.sin(a2)*r);
      ctx.stroke();
    }
  }

  function drawHeadAccessory(ctx,C,s,bulk,headCY){
    const headR=0.3*s*bulk;
    const lw=0.025*s*bulk;
    if(C.ears==="goblin"){
      [-1,1].forEach(side=>{
        ctx.beginPath();
        ctx.moveTo(side*headR*0.7, headCY-headR*0.2);
        ctx.lineTo(side*headR*1.9, headCY-headR*0.6);
        ctx.lineTo(side*headR*0.6, headCY+headR*0.3);
        ctx.closePath();
        ptOut(ctx,C.head||C.body,lw);
      });
    } else if(C.ears==="horns"){
      [-1,1].forEach(side=>{
        ctx.beginPath();
        ctx.moveTo(side*headR*0.5, headCY-headR*0.6);
        ctx.lineTo(side*headR*1.1, headCY-headR*1.6);
        ctx.lineTo(side*headR*0.15, headCY-headR*0.55);
        ctx.closePath();
        ptOut(ctx,C.horn||"#e8dfc4",lw);
      });
    } else if(C.ears==="hood"){
      ctx.beginPath();
      ctx.arc(0,headCY-headR*0.1, headR*1.25, Math.PI*0.85, Math.PI*2.15);
      ctx.closePath();
      ptOut(ctx,C.cloak||C.body,lw);
    } else if(C.ears==="helmet"){
      ctx.beginPath();
      ctx.arc(0,headCY-headR*0.05, headR*1.15, Math.PI, Math.PI*2);
      ctx.closePath();
      ptOut(ctx,C.armor||C.body,lw);
      ctx.fillStyle=darken(C.armor||C.body,0.15);
      ctx.fillRect(-headR*0.08, headCY-headR*0.1, headR*0.16, headR*0.9);
    } else if(C.ears==="crown"){
      const cy=headCY-headR*1.0;
      ctx.beginPath();
      ctx.moveTo(-headR*0.9,cy);
      ctx.lineTo(-headR*0.9,cy-headR*0.5);
      ctx.lineTo(-headR*0.45,cy);
      ctx.lineTo(0,cy-headR*0.7);
      ctx.lineTo(headR*0.45,cy);
      ctx.lineTo(headR*0.9,cy-headR*0.5);
      ctx.lineTo(headR*0.9,cy);
      ctx.closePath();
      ptOut(ctx,"#e8c23e",lw);
      ctx.beginPath(); ctx.arc(0,cy-headR*0.15,headR*0.16,0,Math.PI*2);
      ptOut(ctx,"#c8404f",lw*0.6);
    }
  }

  function drawFace(ctx,C,s,bulk,headCY,blinkOpen){
    ctx.strokeStyle=INK; ctx.lineWidth=0.035*s*bulk; ctx.lineCap="round";
    if(C.expr==="fierce"){
      [-1,1].forEach(side=>{
        ctx.beginPath();
        ctx.moveTo(side*0.03*s*bulk, headCY-0.17*s*bulk);
        ctx.lineTo(side*0.22*s*bulk, headCY-0.08*s*bulk);
        ctx.stroke();
      });
    } else if(C.expr==="scared"){
      [-1,1].forEach(side=>{
        ctx.beginPath();
        ctx.moveTo(side*0.04*s*bulk, headCY-0.14*s*bulk);
        ctx.quadraticCurveTo(side*0.14*s*bulk, headCY-0.23*s*bulk, side*0.22*s*bulk, headCY-0.15*s*bulk);
        ctx.stroke();
      });
    } else if(C.expr==="determined"){
      [-1,1].forEach(side=>{
        ctx.beginPath();
        ctx.moveTo(side*0.04*s*bulk, headCY-0.13*s*bulk);
        ctx.lineTo(side*0.22*s*bulk, headCY-0.16*s*bulk);
        ctx.stroke();
      });
    } else {
      [-1,1].forEach(side=>{
        ctx.beginPath();
        ctx.moveTo(side*0.04*s*bulk, headCY-0.14*s*bulk);
        ctx.lineTo(side*0.2*s*bulk, headCY-0.14*s*bulk);
        ctx.stroke();
      });
    }

    [-1,1].forEach(side=>{
      const ex=side*0.12*s*bulk, ey=headCY;
      if(blinkOpen>0.18){
        ctx.beginPath();
        ctx.ellipse(ex,ey,0.078*s*bulk, 0.078*s*bulk*blinkOpen, 0,0,Math.PI*2);
        ctx.fillStyle=C.sclera||"#fff"; ctx.fill();
        ctx.strokeStyle=INK; ctx.lineWidth=0.012*s*bulk; ctx.stroke();
        ctx.beginPath();
        ctx.arc(ex+side*0.012*s*bulk, ey+0.008*s*bulk*blinkOpen, 0.033*s*bulk*blinkOpen,0,Math.PI*2);
        ctx.fillStyle=C.pupil||"#1a1a1a"; ctx.fill();
        ctx.beginPath();
        ctx.arc(ex-side*0.016*s*bulk, ey-0.022*s*bulk*blinkOpen, 0.013*s*bulk,0,Math.PI*2);
        ctx.fillStyle="rgba(255,255,255,0.85)"; ctx.fill();
      } else {
        ctx.strokeStyle=INK; ctx.lineWidth=0.03*s*bulk; ctx.lineCap="round";
        ctx.beginPath(); ctx.moveTo(ex-0.07*s*bulk,ey); ctx.lineTo(ex+0.07*s*bulk,ey); ctx.stroke();
      }
    });

    const my=headCY+0.17*s*bulk;
    if(C.expr==="fierce"){
      ctx.beginPath();
      ctx.moveTo(-0.14*s*bulk,my); ctx.lineTo(0.14*s*bulk,my);
      ctx.lineTo(0.09*s*bulk,my+0.11*s*bulk); ctx.lineTo(-0.09*s*bulk,my+0.11*s*bulk);
      ctx.closePath();
      ptOut(ctx,"#3a1414",0.02*s*bulk);
      ctx.fillStyle="#f2ead9";
      [-0.07,0,0.07].forEach(dx=>{
        ctx.beginPath();
        ctx.moveTo(dx*s*bulk-0.02*s*bulk,my); ctx.lineTo(dx*s*bulk+0.02*s*bulk,my); ctx.lineTo(dx*s*bulk,my+0.05*s*bulk);
        ctx.closePath(); ctx.fill();
      });
    } else if(C.expr==="scared"){
      ctx.beginPath();
      ctx.ellipse(0,my,0.05*s*bulk,0.065*s*bulk,0,0,Math.PI*2);
      ptOut(ctx,"#3a1414",0.016*s*bulk);
    } else {
      ctx.strokeStyle=INK; ctx.lineWidth=0.028*s*bulk; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(-0.08*s*bulk,my); ctx.lineTo(0.08*s*bulk,my); ctx.stroke();
    }

    if(C.ears==="tusks"){
      [-1,1].forEach(side=>{
        ctx.beginPath();
        ctx.moveTo(side*0.14*s*bulk, headCY+0.13*s*bulk);
        ctx.lineTo(side*0.23*s*bulk, headCY+0.3*s*bulk);
        ctx.lineTo(side*0.05*s*bulk, headCY+0.22*s*bulk);
        ctx.closePath();
        ptOut(ctx,"#f2ead9",0.014*s*bulk);
      });
    }
  }

  // Draws a creature centered on (0,0) = feet baseline, facing right by default.
  function drawCharacter(ctx,kind,s,phase,amp,blinkClock){
    amp = amp===undefined?1:amp;
    blinkClock = blinkClock===undefined?0:blinkClock;
    const C=CHAR_STYLES[kind];
    const bulk=C.bulk||1;
    const bob=Math.abs(Math.sin(phase))*s*0.07*amp;
    ctx.save();
    ctx.translate(0,-bob);

    if(C.tail){
      ctx.strokeStyle=C.dark; ctx.lineWidth=0.16*s*bulk; ctx.lineCap="round";
      ctx.beginPath();
      ctx.moveTo(0.3*s*bulk,-0.35*s);
      ctx.quadraticCurveTo(0.9*s*bulk+Math.sin(phase)*0.08*s, -0.15*s, 1.05*s*bulk, -0.55*s);
      ctx.stroke();
      ctx.strokeStyle=INK; ctx.lineWidth=0.02*s*bulk;
      ctx.stroke();
    }
    if(C.wings){
      const flap=Math.sin(phase*1.4)*0.3*amp;
      [-1,1].forEach(side=>{
        ctx.save();
        ctx.translate(side*0.3*s*bulk,-0.62*s);
        ctx.rotate(side*(0.5+flap));
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.quadraticCurveTo(side*0.9*s,-0.7*s, side*1.15*s, 0.05*s);
        ctx.quadraticCurveTo(side*0.55*s, 0.1*s, 0,0.15*s);
        ctx.closePath();
        ptOut(ctx, C.wing||"rgba(80,30,20,0.85)", 0.02*s);
        ctx.restore();
      });
    }
    if(C.cape){
      const sway=Math.sin(phase*0.8)*0.06*amp;
      ctx.beginPath();
      ctx.moveTo(-0.3*s,-0.65*s);
      ctx.quadraticCurveTo(-0.55*s+sway*s, -0.1*s, -0.14*s, 0.05*s);
      ctx.lineTo(0.14*s,0.05*s);
      ctx.quadraticCurveTo(0.55*s-sway*s, -0.1*s, 0.3*s,-0.65*s);
      ctx.closePath();
      ptOut(ctx,C.cape,0.02*s);
    }

    [-1,1].forEach(side=>{
      ctx.beginPath();
      ctx.ellipse(side*0.16*s, -0.14*s, 0.14*s*bulk, 0.2*s*bulk, 0,0,Math.PI*2);
      ptOut(ctx,C.dark,0.03*s);
    });

    ctx.beginPath();
    ctx.ellipse(0,-0.5*s, 0.38*s*bulk, 0.32*s*bulk, 0,0,Math.PI*2);
    ptOut(ctx, radialShade(ctx,-0.05*s,-0.55*s,0.38*s*bulk,C.body), 0.035*s);

    if(C.cloth){
      ctx.beginPath();
      ctx.ellipse(0,-0.28*s, 0.32*s*bulk, 0.14*s*bulk, 0,0,Math.PI*2);
      ptOut(ctx,C.cloth,0.025*s);
    }

    [[-1,false],[1,true]].forEach(([side,isWeapon])=>{
      ctx.save();
      ctx.translate(side*0.36*s*bulk, -0.55*s);
      const swing=Math.sin(phase+(side<0?Math.PI:0))*0.35*amp;
      ctx.rotate(side*0.15+swing*side);
      ctx.beginPath();
      ctx.ellipse(0,0.22*s, 0.11*s*bulk, 0.22*s*bulk, 0,0,Math.PI*2);
      ptOut(ctx, C.armColor||C.body, 0.028*s);
      if(isWeapon && C.weapon && C.weapon!=="none") drawWeapon(ctx,s,C.weapon,C);
      ctx.restore();
    });

    if(C.shield){
      ctx.save();
      ctx.translate(-0.48*s*bulk,-0.5*s);
      ctx.beginPath();
      ctx.moveTo(0,-0.22*s);
      ctx.lineTo(0.18*s,-0.12*s);
      ctx.lineTo(0.18*s,0.12*s);
      ctx.quadraticCurveTo(0,0.3*s,-0.18*s,0.12*s);
      ctx.lineTo(-0.18*s,-0.12*s);
      ctx.closePath();
      ptOut(ctx,C.shieldColor||"#3a4f8a",0.03*s);
      ctx.strokeStyle=lighten(C.shieldColor||"#3a4f8a",0.4);
      ctx.lineWidth=0.015*s;
      ctx.beginPath(); ctx.moveTo(0,-0.16*s); ctx.lineTo(0,0.08*s); ctx.stroke();
      ctx.restore();
    }

    const headCY=-0.98*s*(bulk>1?1.05:1);
    ctx.beginPath();
    ctx.arc(0,headCY,0.3*s*bulk,0,Math.PI*2);
    ptOut(ctx, radialShade(ctx,-0.06*s*bulk,headCY-0.05*s*bulk,0.3*s*bulk,C.head||C.body), 0.035*s);

    drawHeadAccessory(ctx,C,s,bulk,headCY);

    const cyc=blinkClock%3.2;
    const blinkOpen = cyc>3.0 ? Math.max(0,(3.2-cyc)/0.2) : 1;
    drawFace(ctx,C,s,bulk,headCY,blinkOpen);

    ctx.restore();
  }

  function drawTree(ctx,x,y){
    ctx.save(); ctx.translate(x,y);
    ctx.fillStyle="rgba(0,0,0,0.22)";
    ctx.beginPath(); ctx.ellipse(0,5,11,4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#4a3423";
    ctx.fillRect(-2.2,-4,4.4,9);
    ctx.fillStyle="#2c4a24";
    ctx.beginPath(); ctx.arc(0,-11,12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#3d6531";
    ctx.beginPath(); ctx.arc(-3,-15,8.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(0,-11,12,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  function drawRock(ctx,x,y){
    ctx.save(); ctx.translate(x,y);
    ctx.fillStyle="rgba(0,0,0,0.2)";
    ctx.beginPath(); ctx.ellipse(0,3,8,3,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#5c5a52";
    ctx.beginPath(); ctx.ellipse(0,0,8,5.5,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle="#807c70";
    ctx.beginPath(); ctx.ellipse(-2,-1.5,3,2,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawCamp(ctx,camp,time,isNight){
    ctx.save(); ctx.translate(camp.x,camp.y);
    if(camp.alive && isNight){
      const pulse=0.22+0.14*Math.sin(time*3);
      ctx.beginPath(); ctx.arc(0,12,28,0,Math.PI*2);
      ctx.fillStyle="rgba(200,50,50,"+pulse+")"; ctx.fill();
    }
    ctx.fillStyle="rgba(0,0,0,0.3)";
    ctx.beginPath(); ctx.ellipse(0,13,20,7,0,0,Math.PI*2); ctx.fill();
    if(camp.alive){
      ctx.fillStyle="#8a3030";
      ctx.beginPath(); ctx.moveTo(-15,9); ctx.lineTo(0,-20); ctx.lineTo(15,9); ctx.closePath();
      ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=1.4; ctx.stroke();
      ctx.fillStyle="#6e2424";
      ctx.beginPath(); ctx.moveTo(-5,9); ctx.lineTo(0,-5); ctx.lineTo(5,9); ctx.closePath(); ctx.fill();
      ctx.strokeStyle="#4a3a28"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(0,-33); ctx.stroke();
      ctx.fillStyle="#c8404f";
      ctx.beginPath(); ctx.moveTo(0,-33); ctx.lineTo(13,-28); ctx.lineTo(0,-24); ctx.closePath(); ctx.fill();
      if(camp.hp<camp.maxHp){
        const pct=Math.max(0,camp.hp/camp.maxHp);
        ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(-16,-42,32,4);
        ctx.fillStyle="#c8404f"; ctx.fillRect(-16,-42,32*pct,4);
      }
    } else {
      ctx.fillStyle="#3a3128";
      ctx.beginPath(); ctx.ellipse(-5,4,8,4,0.3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6,5,6,3.5,-0.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="rgba(40,20,10,0.4)";
      ctx.beginPath(); ctx.ellipse(0,7,14,5,0,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function drawHouse(ctx,house,simTime){
    const bob=Math.sin(simTime*2.4+ (house.seed||0))*1.6;
    if(!house.bought){
      ctx.save();
      ctx.translate(house.x,house.y+bob);
      ctx.rotate(Math.PI/4);
      roundRectPath(ctx,-12,-12,24,24,5);
      ctx.fillStyle="rgba(20,45,20,0.6)"; ctx.fill();
      ctx.setLineDash([3,3]);
      ctx.strokeStyle= house.affordHint ? "rgba(140,255,120,0.9)" : "rgba(255,255,255,0.7)";
      ctx.lineWidth=1.5; ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      ctx.save();
      ctx.fillStyle="#fff";
      ctx.font="bold 12px Inter, sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(String(house.cost), house.x-4, house.y+bob);
      ctx.beginPath(); ctx.arc(house.x+9,house.y+bob,5,0,Math.PI*2);
      ctx.fillStyle="#d9822e"; ctx.fill();
      ctx.strokeStyle="#8a5518"; ctx.lineWidth=1; ctx.stroke();
      ctx.restore();
      return;
    }
    const roofColor = house.type==="workshop" ? "#5a8ab0" : "#c98a4a";
    const wallColor = house.type==="workshop" ? "#3f6b8a" : "#8a5c34";
    ctx.save();
    ctx.translate(house.x,house.y);
    ctx.fillStyle="rgba(0,0,0,0.3)";
    ctx.beginPath(); ctx.ellipse(0,15,18,6.5,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=INK; ctx.lineWidth=1.4;
    ctx.fillStyle=wallColor;
    ctx.fillRect(-13,-5,26,20); ctx.strokeRect(-13,-5,26,20);
    ctx.fillStyle=roofColor;
    ctx.beginPath(); ctx.moveTo(-17,-5); ctx.lineTo(0,-22); ctx.lineTo(17,-5); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle="#241d18";
    ctx.fillRect(-4,5,8,9);
    if(house.type==="workshop"){
      const g=ctx.createRadialGradient(0,-12,0,0,-12,9);
      g.addColorStop(0,"rgba(255,224,138,0.9)"); g.addColorStop(1,"rgba(255,224,138,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,-12,9,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
    ctx.save();
    ctx.translate(house.x,house.y-32);
    ctx.fillStyle="#ffe08a";
    ctx.font="bold 10px Inter, sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(house.residents.length+"/"+house.capacity, 0, 0);
    ctx.restore();
    if(house.type==="workshop"){
      ctx.save();
      ctx.translate(house.x,house.y-44+bob*0.5);
      ctx.fillStyle="#ffe08a";
      ctx.font="bold 10px Inter, sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("⚒ tap", 0, 0);
      ctx.restore();
    }
  }

  function drawRecruit(ctx,r,simTime){
    const s=BASE_SCALE[r.type];
    ctx.beginPath();
    ctx.ellipse(r.x, r.y+s*0.05, s*0.5, s*0.16, 0,0,Math.PI*2);
    ctx.fillStyle="rgba(0,0,0,0.32)"; ctx.fill();
    if(r.state!=="walking"){
      ctx.beginPath();
      ctx.arc(r.x, r.y-s*0.6, s*1.15, 0, Math.PI*2);
      ctx.fillStyle="rgba(140,255,120,0.14)"; ctx.fill();
    }
    ctx.save();
    ctx.translate(r.x,r.y);
    if(r.facing<0) ctx.scale(-1,1);
    drawCharacter(ctx, r.type, s, (r.wanderT||0)*1.6, 0.6, simTime+r.blinkSeed);
    ctx.restore();
    if(r.state==="walking" && r.thanksMsg){
      const bx=r.x, by=r.y-s*2.1;
      ctx.font="bold 10px Inter, sans-serif";
      const w=ctx.measureText(r.thanksMsg).width+12;
      ctx.save();
      roundRectPath(ctx,bx-w/2,by-11,w,18,6);
      ctx.fillStyle="rgba(255,255,255,0.92)"; ctx.fill();
      ctx.strokeStyle="rgba(0,0,0,0.25)"; ctx.lineWidth=1; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(bx-4,by+7); ctx.lineTo(bx+4,by+7); ctx.lineTo(bx,by+13); ctx.closePath();
      ctx.fillStyle="rgba(255,255,255,0.92)"; ctx.fill();
      ctx.fillStyle="#241d16";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(r.thanksMsg, bx, by-1);
      ctx.restore();
    }
  }

  function drawMerchant(ctx,m,simTime){
    const s=BASE_SCALE.merchant;
    ctx.beginPath();
    ctx.ellipse(m.x, m.y+s*0.05, s*0.55, s*0.18, 0,0,Math.PI*2);
    ctx.fillStyle="rgba(0,0,0,0.32)"; ctx.fill();
    ctx.save();
    ctx.translate(m.x,m.y);
    drawCharacter(ctx, "merchant", s, Math.sin(simTime*1.2)*0.3, 0.25, simTime+m.blinkSeed);
    ctx.restore();
    const by=m.y-s*2.1;
    const label="🌱 "+SEED_COST+"g";
    ctx.font="bold 10px Inter, sans-serif";
    const w=ctx.measureText(label).width+14;
    ctx.save();
    roundRectPath(ctx,m.x-w/2,by-11,w,18,6);
    ctx.fillStyle="rgba(255,255,255,0.92)"; ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,0.25)"; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(m.x-4,by+7); ctx.lineTo(m.x+4,by+7); ctx.lineTo(m.x,by+13); ctx.closePath();
    ctx.fillStyle="rgba(255,255,255,0.92)"; ctx.fill();
    ctx.fillStyle="#241d16";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(label, m.x, by-1);
    ctx.restore();
  }

  function drawSapling(ctx,t){
    const pct=Math.min(1,1-t.growTimer/TREE_GROW_TIME);
    ctx.save(); ctx.translate(t.x,t.y);
    ctx.fillStyle="rgba(0,0,0,0.2)";
    ctx.beginPath(); ctx.ellipse(0,3,6,2.4,0,0,Math.PI*2); ctx.fill();
    const h=3+pct*7;
    ctx.strokeStyle="#4a3423"; ctx.lineWidth=1.6; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(0,2); ctx.lineTo(0,2-h); ctx.stroke();
    ctx.fillStyle="#5a9a3e";
    ctx.beginPath(); ctx.arc(0,2-h,2.5+pct*2.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,0.5)"; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.arc(0,-9,7,-Math.PI/2,-Math.PI/2+Math.PI*2*pct); ctx.stroke();
    ctx.strokeStyle="rgba(140,255,120,0.9)"; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(0,-9,7,-Math.PI/2,-Math.PI/2+Math.PI*2*pct); ctx.stroke();
    ctx.restore();
  }

    return {
      hpMult: 1+0.16*(n-1),
      dmgMult: 1+0.08*(n-1),
      speedMult: 1+0.05*(n-1),
      rangeMult: 1+0.04*(n-1),

  function makeIcon(kind,size){
    const dpr=Math.max(1,window.devicePixelRatio||1);
    const c=document.createElement("canvas");
    c.width=size*dpr; c.height=size*dpr;
    c.style.width=size+"px"; c.style.height=size+"px";
    const ictx=c.getContext("2d");
    ictx.scale(dpr,dpr);
    ictx.translate(size/2, size*0.78);
    const s=size*0.32;
    ictx.beginPath();
    ictx.ellipse(0,s*0.1,s*0.7,s*0.2,0,0,Math.PI*2);
    ictx.fillStyle="rgba(0,0,0,0.3)"; ictx.fill();
    drawCharacter(ictx, kind, s, 0.6, 0.4, 0);
    return c;
  }

  const JOY_RADIUS=23;

  function joyReset(){
    joyVec={x:0,y:0};
    knobEl.style.transform="translate(0px,0px)";
  }
  function joyHandle(clientX,clientY){
    const rect=joyEl.getBoundingClientRect();
    const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    let dx=clientX-cx, dy=clientY-cy;
    const d=Math.hypot(dx,dy);
    if(d>JOY_RADIUS){ dx=dx/d*JOY_RADIUS; dy=dy/d*JOY_RADIUS; }
    knobEl.style.transform="translate("+dx+"px,"+dy+"px)";
    joyVec={x:dx/JOY_RADIUS, y:dy/JOY_RADIUS};
  }
  joyEl.addEventListener("pointerdown",(e)=>{
    joyActive=true; joyPointerId=e.pointerId;
    joyEl.setPointerCapture(e.pointerId);
    joyHandle(e.clientX,e.clientY);
  });
  joyEl.addEventListener("pointermove",(e)=>{
    if(!joyActive || e.pointerId!==joyPointerId) return;
    joyHandle(e.clientX,e.clientY);
  });
  function joyEnd(e){
    if(e.pointerId!==joyPointerId) return;
    joyActive=false; joyPointerId=null; joyReset();
  }
  joyEl.addEventListener("pointerup",joyEnd);
  joyEl.addEventListener("pointercancel",joyEnd);

  function pickEnemyType(){ return SPAWN_POOL[Math.floor(Math.random()*SPAWN_POOL.length)]; }

  function trySpawnFromCamp(camp,dt,diff){
    if(phase!=="night" || !camp.alive) return;
    camp.spawnTimer-=dt;
    if(camp.spawnTimer>0) return;
    if(camp.activeGuards>=diff.guardCap) return;
    const type=pickEnemyType();
    const cfg=ENEMY_TYPES[type];
    const ang=Math.random()*Math.PI*2, rad=18+Math.random()*8;
    const sx=camp.x+Math.cos(ang)*rad, sy=camp.y+Math.sin(ang)*rad;
    const hp=Math.round(cfg.hp*diff.hpMult);
    const dmg=Math.round(cfg.dmg*diff.dmgMult);
    const spd=Math.round(cfg.speed*diff.speedMult);
    const atkR=Math.round(cfg.atkRange*diff.rangeMult);
    enemies.push({
      type, hp, maxHp:hp, speed:spd, reward:cfg.reward, dmg,
      atkRange:atkR, rate:cfg.rate, x:sx, y:sy, homeX:sx, homeY:sy, cd:0, facing:1,
      dead:false, flashTimer:0, blinkSeed:Math.random()*3.2, wanderT:Math.random()*10, campRef:camp,
    });
    camp.activeGuards++;
    camp.spawnTimer=diff.spawnMin+Math.random()*(diff.spawnMax-diff.spawnMin);
  }

    const diff=nightDifficulty(nightNumber);

      dmg:Math.round(13*diff.dmgMult), atkRange:Math.round(30*diff.rangeMult), rate:0.75,

  function onNightStart(){
    recruits=recruits.filter(r=>r.state==="walking");
    merchant=null;
    for(const camp of camps){ camp.activeGuards=0; camp.spawnTimer=0.4+Math.random()*0.8; }

    const wantToAdd=1+Math.floor(Math.random()*2);
    while(newHouses<wantToAdd && houses.length<MAX_HOUSES){
      let attempts=0, placed=false;
      while(attempts<40 && !placed){
        attempts++;
        const x=20+Math.random()*(LOGICAL_W-40), y=20+Math.random()*(LOGICAL_H-40);
        let ok=true;
        for(const c of CAMP_SPOTS) if(Math.hypot(x-c.x,y-c.y)<45) ok=false;
        for(const h of houses) if(Math.hypot(x-h.x,y-h.y)<45) ok=false;
        if(Math.hypot(x-HERO_START.x,y-HERO_START.y)<30) ok=false;
        if(!ok) continue;
        houses.push({x,y,type:"plain",bought:false,residents:[],capacity:HOUSE_CAPACITY,
          cost:additionalHouseCost(houses.length), affordHint:false, seed:Math.random()*10});

      newHouses++;

  // ===================== DAMAGE =====================
  function applyHeroDamage(target){
    let dmg=hero.dmg;
    target.hp-=dmg;
    target.flashTimer=0.12;
    floatText("-"+Math.round(dmg), target.x, target.y-16, "#e9dfc4");
    if(hero.splash>0){
      const pool = boss ? enemies.concat([boss]) : enemies;
      for(const en of pool){
        if(en.dead||en===target) continue;
        if(Math.hypot(en.x-target.x,en.y-target.y)<=hero.splash){
          en.hp-=dmg*0.7; en.flashTimer=0.12;
        }
      }
    }
    if(target.hp<=0 && !target.dead){
      target.dead=true;
      if(target.isBoss){
        const bonus=80+nightNumber*10;
        gold+=bonus;
        toast("Champion defeated! +"+bonus+"g",2400);
        spawnDeathBurst(target.x,target.y,CHAR_STYLES.boss.body);
        boss=null;
      } else {
        totalKills++;
        const earned=target.reward+(hero.bonusGold||0);
        gold+=earned;
        if(target.campRef) target.campRef.activeGuards=Math.max(0,target.campRef.activeGuards-1);
        floatText("+"+earned+"g", target.x, target.y-14, "#d9822e");
        spawnDeathBurst(target.x, target.y, CHAR_STYLES[target.type].body);
      }
    }
  }

  function findHeroTarget(){
    let best=null, bestD=Infinity;
    const pool = boss ? enemies.concat([boss]) : enemies;
    for(const en of pool){
      if(en.dead) continue;
      const d=Math.hypot(en.x-hero.x,en.y-hero.y);
      if(d<=hero.range && d<bestD){ bestD=d; best=en; }
    }
    return best;
  }

  // ===================== UPDATE =====================
  function update(dt){
    simTime+=dt;
    if(!battleActive || battleOver) return;

    hero.x=clamp(hero.x+joyVec.x*hero.speed*dt, 18, LOGICAL_W-18);
    hero.y=clamp(hero.y+joyVec.y*hero.speed*dt, 18, LOGICAL_H-18);
    const moveMag=Math.hypot(joyVec.x,joyVec.y);
    if(moveMag>0.15){
      hero.distAccum+=hero.speed*dt;
      hero.facing = joyVec.x<-0.1 ? -1 : (joyVec.x>0.1 ? 1 : hero.facing);
    }
    if(hero.flashTimer>0) hero.flashTimer=Math.max(0,hero.flashTimer-dt);

    // ---- day/night cycle ----
    phaseTimer-=dt;
    if(phaseTimer<=0){
      if(phase==="day"){
        phase="night"; nightNumber+=1; phaseTimer=NIGHT_LEN;
        onNightStart();
        toast("🌙 Night falls — Wave "+nightNumber+" begins!",2600);
      } else {
        phase="day"; phaseTimer=DAY_LEN; dayNumber+=1;
        hero.hp=hero.maxHp;
        onDayStart();
        toast("☀ Dawn breaks. You feel fully healed.",2400);
      }
    }

    const diff=nightDifficulty(Math.max(1,nightNumber));
    for(const camp of camps) trySpawnFromCamp(camp,dt,diff);

    for(const en of enemies){
      if(en.dead) continue;
      if(en.flashTimer>0) en.flashTimer=Math.max(0,en.flashTimer-dt);
      en.wanderT=(en.wanderT||0)+dt;
      const dHero=Math.hypot(hero.x-en.x,hero.y-en.y);
      if(dHero>en.atkRange*0.9){
        const dx=(hero.x-en.x)/dHero, dy=(hero.y-en.y)/dHero;
        en.x+=dx*en.speed*dt; en.y+=dy*en.speed*dt;
        en.facing = dx<0?-1:1;
      } else {
        en.cd-=dt;
        if(en.cd<=0){
          en.cd=1/en.rate;
          hero.hp-=en.dmg; hero.flashTimer=0.15;
          floatText("-"+en.dmg, hero.x, hero.y-30, "#c8404f");
          if(hero.hp<=0){ hero.hp=0; triggerDefeat(); }
        }
      }
    }

    if(boss && !boss.dead){
      if(boss.flashTimer>0) boss.flashTimer=Math.max(0,boss.flashTimer-dt);
      const dHero=Math.hypot(hero.x-boss.x,hero.y-boss.y);
      if(dHero>boss.atkRange*0.9){
        const dx=(hero.x-boss.x)/dHero, dy=(hero.y-boss.y)/dHero;
        boss.x+=dx*boss.speed*dt; boss.y+=dy*boss.speed*dt;
        boss.facing = dx<0?-1:1;
      } else {
        boss.cd-=dt;
        if(boss.cd<=0){
          boss.cd=1/boss.rate;
          hero.hp-=boss.dmg; hero.flashTimer=0.15;
          floatText("-"+boss.dmg, hero.x, hero.y-30, "#c8404f");
          if(hero.hp<=0){ hero.hp=0; triggerDefeat(); }
        }
      }
    }

    if(hero.cd>0) hero.cd-=dt;
    if(hero.cd<=0){
      const target=findHeroTarget();
      if(target){
        hero.cd=1/hero.rate;
        const tx=target.x, ty=target.y-10;
        shots.push({x1:hero.x,y1:hero.y-14,x2:tx,y2:ty,life:0.15,maxLife:0.15,color:hero.color});
        applyHeroDamage(target);
      }
    }
    enemies=enemies.filter(en=>!en.dead);

    // ---- recruits (day only) ----
    if(phase==="day"){
      recruitSpawnTimer-=dt;
      const wanderCount=recruits.filter(r=>r.state!=="walking").length;
      if(recruitSpawnTimer<=0 && wanderCount<6){
        spawnRecruit();
        recruitSpawnTimer=3+Math.random()*3;
      }
      for(const r of recruits){
        if(r.state==="walking"){
          const dx=r.house.x-r.x, dy=(r.house.y-6)-r.y, d=Math.hypot(dx,dy);
          if(d<8){ r.arrived=true; }
          else { r.x+=dx/d*42*dt; r.y+=dy/d*42*dt; r.facing = dx<0?-1:1; }
          r.wanderT=(r.wanderT||0)+dt;
          continue;
        }
        r.retargetTimer-=dt;
        if(r.retargetTimer<=0){
          r.targetX=clamp(r.homeX+(Math.random()-0.5)*90, 20, LOGICAL_W-20);
          r.targetY=clamp(r.homeY+(Math.random()-0.5)*90, 20, LOGICAL_H-20);
          r.retargetTimer=2+Math.random()*3;
        }
        const dx=r.targetX-r.x, dy=r.targetY-r.y, d=Math.hypot(dx,dy);
        if(d>2){ r.x+=dx/d*22*dt; r.y+=dy/d*22*dt; r.facing = dx<0?-1:1; }
        r.wanderT=(r.wanderT||0)+dt;
      }
      for(const r of recruits){
        if(r.state!=="wander") continue;
        if(Math.hypot(hero.x-r.x,hero.y-r.y) < 20){
          const house=houses.find(h=>h.bought && h.residents.length<h.capacity);
          if(house){
            house.residents.push({type:r.type});
            r.state="walking";
            r.house=house;
            r.thanksMsg = Math.random()<0.5 ? "Thanks!" : "You saved me!";
            spawnDeathBurst(r.x,r.y-8,"#8fff9a");
          } else if(recruitDeniedTimer<=0){
            toast("All houses are full",1600);
            recruitDeniedTimer=3;
          }
        }
      }
      recruits=recruits.filter(r=>!r.arrived);
    }
    if(recruitDeniedTimer>0) recruitDeniedTimer-=dt;

    // ---- houses: buy on approach ----
    for(const house of houses){
      if(!house.bought){
        const d=Math.hypot(hero.x-house.x,hero.y-house.y);
        if(d<22) tryBuyHouse(house);
        else if(d>34) house.affordHint=false;
      }
    }

    // ---- trees growing ----
    for(const t of trees){
      if(!t.mature){
        t.growTimer-=dt;
        if(t.growTimer<=0){ t.growTimer=0; t.mature=true; toast("A seed has grown into a tree!",1800); }
      }
    }

    // ---- passive income ----
    incomeTimer-=dt;
    if(incomeTimer<=0){
      incomeTimer=1;
      let income=0;
      for(const house of houses) if(house.bought) income+=house.residents.length;
      for(const t of trees) if(t.mature) income+=TREE_INCOME;
      if(income>0){
        gold+=income;
        floatText("+"+income+"g", hero.x, hero.y-40, "#ffe08a");
      }
    }

    for(const s of shots) s.life-=dt;
    shots=shots.filter(s=>s.life>0);
    for(const f of floats){ f.life-=dt; f.y-=18*dt; }
    floats=floats.filter(f=>f.life>0);
    for(const p of particles){ p.vy+=220*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
    particles=particles.filter(p=>p.life>0);

    updateHud();
  }

  function updateHud(){
    goldVal.textContent=gold;
    heroHpVal.textContent= hero ? Math.max(0,Math.round(hero.hp))+"/"+hero.maxHp : "0/0";
    waveEl.textContent="Wave: "+nightNumber;
    const secs=Math.max(0,Math.ceil(phaseTimer));
    if(phase==="day"){
      phaseVal.textContent="Day "+secs+"s";
      phaseStat.classList.remove("night");
      phaseIcon.innerHTML='<circle cx="8" cy="8" r="5.5" fill="#ffd35a" stroke="#a87a1a" stroke-width="0.8"/>';
    } else {
      phaseVal.textContent="Night "+secs+"s";
      phaseStat.classList.add("night");
      phaseIcon.innerHTML='<circle cx="8" cy="8" r="5.5" fill="#3a3f6b" stroke="#8fa9ff" stroke-width="0.8"/><circle cx="10" cy="6.5" r="4.3" fill="#1b1712"/>';
    }
  }

  // ===================== RENDER =====================
  function drawHeroEntity(){
    const s=HERO_DISPLAY_SCALE[hero.type];
    ctx.beginPath();
    ctx.ellipse(hero.x, hero.y+s*0.05, s*0.55, s*0.18, 0,0,Math.PI*2);
    ctx.fillStyle="rgba(0,0,0,0.35)"; ctx.fill();
    ctx.save();
    ctx.translate(hero.x,hero.y);
    if(hero.facing<0) ctx.scale(-1,1);
    const phase2=hero.distAccum/9;
    drawCharacter(ctx, hero.type, s, phase2, 1, simTime+hero.blinkSeed);
    if(hero.flashTimer>0){
      ctx.globalCompositeOperation="lighter";
      ctx.fillStyle="rgba(255,90,90,"+Math.min(0.6,(hero.flashTimer/0.15)*0.6)+")";
      ctx.beginPath(); ctx.arc(0,-s*0.55, s*0.55, 0,Math.PI*2); ctx.fill();
      ctx.globalCompositeOperation="source-over";
    }
    ctx.restore();
    const w=28;
    const pct=Math.max(0,hero.hp/hero.maxHp);
    const barY=hero.y - s*1.6 - 6;
    ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(hero.x-w/2, barY, w, 5);
    ctx.fillStyle="#7fae4a"; ctx.fillRect(hero.x-w/2, barY, w*pct, 5);
    ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.strokeRect(hero.x-w/2,barY,w,5);
  }

  function drawEnemyEntity(en){
    const s= en.isBoss ? BASE_SCALE.boss : BASE_SCALE[en.type];
    ctx.beginPath();
    ctx.ellipse(en.x, en.y+s*0.05, s*0.55, s*0.18, 0,0,Math.PI*2);
    ctx.fillStyle="rgba(0,0,0,0.35)"; ctx.fill();
    ctx.save();
    ctx.translate(en.x,en.y);
    if(en.facing<0) ctx.scale(-1,1);
    const phase2=(en.wanderT||0)*2;
    drawCharacter(ctx, en.type, s, phase2, en.isBoss?1:0.7, simTime+en.blinkSeed);
    if(en.flashTimer>0){
      ctx.globalCompositeOperation="lighter";
      ctx.fillStyle="rgba(255,255,255,"+Math.min(0.7,(en.flashTimer/0.12)*0.7)+")";
      ctx.beginPath(); ctx.arc(0,-s*0.55, s*0.5, 0,Math.PI*2); ctx.fill();
      ctx.globalCompositeOperation="source-over";
    }
    ctx.restore();
    const w=en.isBoss?38:20;
    const pct=Math.max(0,en.hp/en.maxHp);
    const barY=en.y - s*1.55 - 6;
    ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(en.x-w/2, barY, w, 4);
    ctx.fillStyle= pct>0.5?"#c8404f":pct>0.25?"#d9822e":"#7fae4a";
    ctx.fillRect(en.x-w/2, barY, w*pct, 4);
  }

  function drawShots(){
    for(const s of shots){
      const t=1-s.life/s.maxLife;
      const cx=s.x1+(s.x2-s.x1)*t, cy=s.y1+(s.y2-s.y1)*t;
      ctx.strokeStyle=hexToRgba(s.color,0.3);
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(cx,cy); ctx.stroke();
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,7);
      g.addColorStop(0,s.color); g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(cx,cy,7,0,Math.PI*2); ctx.fill();
    }
  }
  function drawParticles(){
    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life/0.8);
      ctx.fillStyle=p.color;
      ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    }
    ctx.globalAlpha=1;
  }
  function drawFloats(){
    ctx.font="12px Inter, sans-serif";
    ctx.textAlign="center";
    for(const f of floats){
      ctx.globalAlpha=Math.max(0,f.life/f.maxLife);
      ctx.fillStyle=f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha=1;
  }

  let vignetteGrad=null;
  function drawVignette(){
    if(!vignetteGrad){
      vignetteGrad=ctx.createRadialGradient(LOGICAL_W/2,LOGICAL_H/2,LOGICAL_H*0.32,LOGICAL_W/2,LOGICAL_H/2,LOGICAL_H*0.85);
      vignetteGrad.addColorStop(0,"rgba(0,0,0,0)");
      vignetteGrad.addColorStop(1,"rgba(0,0,0,0.14)");
    }
    ctx.fillStyle=vignetteGrad;
    ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);
    if(phase==="night"){
      ctx.fillStyle="rgba(20,25,60,0.22)";
      ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);
    }
  }

  function render(){
    ctx.clearRect(0,0,LOGICAL_W,LOGICAL_H);
    ctx.drawImage(bgCanvas,0,0);

    for(const camp of camps) drawCamp(ctx,camp,simTime,phase==="night");
    for(const house of houses) drawHouse(ctx,house,simTime);
    for(const r of recruits) drawRecruit(ctx,r,simTime);
    for(const t of trees){ if(t.mature) drawTree(ctx,t.x,t.y); else drawSapling(ctx,t); }
    if(merchant) drawMerchant(ctx,merchant,simTime);

    if(hero){
      const drawables=[{y:hero.y,kind:"hero"}]
        .concat(enemies.map(en=>({y:en.y,kind:"enemy",ref:en})))
        .concat(boss?[{y:boss.y,kind:"enemy",ref:boss}]:[]);
      drawables.sort((a,b)=>a.y-b.y);
      for(const d of drawables){
        if(d.kind==="hero") drawHeroEntity();
        else drawEnemyEntity(d.ref);
      }
    }

    drawShots();
    drawParticles();
    drawFloats();
    drawVignette();
  }

  // ===================== LOOP =====================
  let lastTime=null;
  function loop(ts){
    if(lastTime===null) lastTime=ts;
    const dt=Math.min(0.05,(ts-lastTime)/1000);
    lastTime=ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  prerenderBackground();
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
